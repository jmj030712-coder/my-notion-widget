<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>디데이 진행바</title>
<style>
  :root {
    --ink: #37352F;
    --muted: #9B9A97;
    --track: #EBECED;
    --bar: #2383E2;
    --chip: #F1F1EF;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #EFEFED;
      --muted: #7F7F7F;
      --track: #3B3B3B;
      --bar: #529CCA;
      --chip: #2F3437;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: transparent; }
  body {
    color: var(--ink);
    font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, "Apple Color Emoji", Arial, sans-serif, "Segoe UI Emoji", "Segoe UI Symbol";
    padding: 8px 4px;
    -webkit-font-smoothing: antialiased;
  }
  .widget { max-width: 640px; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 10px; }
  .title { font-size: 15px; font-weight: 600; }
  .chip { font-size: 12px; font-weight: 500; background: var(--chip); border-radius: 4px; padding: 2px 8px; font-variant-numeric: tabular-nums; }
  .track { height: 8px; background: var(--track); border-radius: 999px; overflow: hidden; }
  .fill { height: 100%; width: 0; background: var(--bar); border-radius: 999px; }
  .meta { display: flex; justify-content: space-between; align-items: baseline; margin-top: 8px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .percent { font-size: 13px; color: var(--ink); font-weight: 500; }
</style>
</head>
<body>
<div class="widget">
  <div class="head">
    <div class="title" id="title"></div>
    <div class="chip" id="dday"></div>
  </div>
  <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="track">
    <div class="fill" id="fill"></div>
  </div>
  <div class="meta">
    <span class="percent" id="percent"></span>
    <span id="remain"></span>
  </div>
</div>

<script>
  // ▼ 여기만 수정하세요 ▼
  const TITLE = "🏗️ 건축공학 학점은행제 수료";
  const START = "2026-03-02T00:00:00";   // 시작 (YYYY-MM-DDTHH:mm:ss)
  const END   = "2028-02-18T00:00:00";   // 목표 수료일
  // ▲ 여기만 수정하세요 ▲

  const start = new Date(START).getTime();
  const end = new Date(END).getTime();
  const SEC = 1000, MIN = 60 * SEC, HOUR = 60 * MIN, DAY = 24 * HOUR;
  const pad = n => String(n).padStart(2, "0");

  const el = id => document.getElementById(id);
  el("title").textContent = TITLE;

  function tick() {
    const now = Date.now();
    const total = end - start;
    const ratio = total > 0 ? Math.min(Math.max((now - start) / total, 0), 1) : 0;
    const pct = ratio * 100;
    const left = Math.max(end - now, 0);

    el("fill").style.width = pct + "%";
    el("percent").textContent = pct.toFixed(6) + "%";
    el("track").setAttribute("aria-valuenow", pct.toFixed(2));

    const days = Math.floor(left / DAY);
    el("dday").textContent = left === 0 ? "D-DAY" : "D-" + Math.ceil(left / DAY);
    el("remain").textContent =
      days + "일 " + pad(Math.floor(left % DAY / HOUR)) + ":" + pad(Math.floor(left % HOUR / MIN)) + ":" + pad(Math.floor(left % MIN / SEC)) + " 남음";
  }

  tick();
  setInterval(tick, 100);
</script>
</body>
</html>
